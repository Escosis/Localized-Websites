name: Update Release Assets

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  # ===== 排除名单：这些文件夹不会被追踪/打包 =====
  EXCLUDE: ".github .git .assets Stella-of-the-End BH3-Visual-Novels"
  # Release 名称与说明
  RELEASE_NAME: "独立网页下载"
  RELEASE_BODY: |
    实际内容等同于项目源代码，仅将其分文件夹打包为 ZIP，便于仅下载某个独立网页。

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- 1. 计算需要打包的文件夹 ----------
      - name: 计算变化的文件夹
        id: changed
        run: |
          set -e
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            candidates=$(find . -maxdepth 1 -type d ! -name '.' -printf '%f\n')
          else
            candidates=$(git diff --name-only \
              "${{ github.event.before }}" "${{ github.sha }}" \
              | awk -F/ 'NF>1 {print $1}' | sort -u)
          fi

          result=""
          for name in $candidates; do
            skip=0
            for ex in $EXCLUDE; do
              [ "$name" = "$ex" ] && skip=1
            done
            [ "$skip" = "1" ] && { echo "排除: $name"; continue; }
            [ -d "$name" ] || continue
            result="$result $name"
          done
          result=$(echo "$result" | xargs)
          echo "folders=$result" >> "$GITHUB_OUTPUT"
          echo "本次需打包: [$result]"

      # ---------- 2. 计算被删除的文件夹 ----------
      - name: 计算被删除的文件夹
        id: deleted
        run: |
          set -e
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "folders=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          removed=$(git diff --name-only --diff-filter=D \
            "${{ github.event.before }}" "${{ github.sha }}" \
            | awk -F/ 'NF>1 {print $1}' | sort -u)

          result=""
          for name in $removed; do
            skip=0
            for ex in $EXCLUDE; do
              [ "$name" = "$ex" ] && skip=1
            done
            [ "$skip" = "1" ] && continue
            # 当前工作区里确实不存在，才视为删除
            [ -d "$name" ] && continue
            result="$result $name"
          done
          result=$(echo "$result" | xargs)
          echo "folders=$result" >> "$GITHUB_OUTPUT"
          echo "本次需删除附件: [$result]"

      # ---------- 3. 删除已移除文件夹对应的旧附件 ----------
      - name: 删除已移除的附件
        if: steps.deleted.outputs.folders != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for name in ${{ steps.deleted.outputs.folders }}; do
            asset="${name}.zip"
            id=$(gh api \
              "repos/${{ github.repository }}/releases/tags/assets" \
              --jq ".assets[] | select(.name==\"$asset\") | .id" || true)
            if [ -n "$id" ]; then
              gh api -X DELETE \
                "repos/${{ github.repository }}/releases/assets/$id"
              echo "已删除附件: $asset"
            else
              echo "未找到附件: $asset，跳过"
            fi
          done

      # ---------- 4. 打包变化的文件夹 ----------
      - name: 打包变化的文件夹
        if: steps.changed.outputs.folders != ''
        run: |
          set -e
          mkdir -p dist
          for name in ${{ steps.changed.outputs.folders }}; do
            (cd "$name" && zip -r "../dist/${name}.zip" . -x "*.DS_Store")
            echo "已打包: ${name}.zip"
          done
          ls -lh dist

      # ---------- 5. 上传到固定 Release ----------
      - name: 上传到 assets Release（覆盖同名附件）
        if: steps.changed.outputs.folders != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: assets
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_BODY }}
          files: dist/*.zip
          fail_on_unmatched_files: false